<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Nuestros recuerdos · Maggy y Robe</title><link rel="stylesheet" href="styles.css"><style>main{max-width:1200px;margin:auto;padding:36px 20px 90px}h1{font-size:clamp(2rem,7vw,4rem)}h2{margin-top:44px}.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}.album img{width:100%;height:260px;object-fit:contain;background:#080808;border-radius:8px}a{color:inherit}p{color:#bbb;font-size:1rem}@media(max-width:500px){.album{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.album img{height:220px}}</style><script src="media-manifest.js"></script><script src="config.js"></script><script>try{if(JSON.parse(localStorage.getItem('rm199_auth'))!==TDN.acceso.password)location.replace('splash.html')}catch{location.replace('splash.html')}</script></head><body><main><a href="index.html">Volver a nuestra historia</a><h1>Las imágenes de nosotros</h1><p>De Robe para Maggy. Cada recuerdo, en su capítulo.</p><div id="album"></div></main><script>document.querySelector('#album').innerHTML=CLIENT_MEDIA.carpetas.map(g=>'<section><h2>'+g.titulo+'</h2><p><a href="episodio.html?t='+(g.numero-1)+'&e=1">Ver película</a></p><div class="album">'+g.fotos.map(f=>'<a href="'+f.ruta+'" target="_blank" rel="noopener"><img loading="lazy" src="'+f.ruta+'" alt="Recuerdo de '+g.titulo+'"></a>').join('')+'</div></section>').join('')</script></body></html>
