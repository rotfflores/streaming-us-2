<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Nuestros recuerdos · Caro y Vale</title><link rel="stylesheet" href="styles.css"><script src="media-manifest.js"></script><script src="config.js"></script><script>try{if(JSON.parse(localStorage.getItem('vc199_auth'))!==TDN.acceso.password)location.replace('splash.html')}catch{location.replace('splash.html')}</script><style>main{max-width:1200px;margin:auto;padding:36px 20px 90px}h1{font-size:clamp(2rem,7vw,4rem)}.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}.album img,.album video{width:100%;height:260px;object-fit:contain;background:#080808;border-radius:8px}a{color:inherit}p{font-size:1rem;color:#bbb}@media(max-width:500px){.album{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.album img,.album video{height:220px}}</style></head><body><main><a href="index.html">Volver a nuestra historia</a><h1>Las imágenes de nosotras</h1><p>De Vale para Caro. Nuestras fotos, para volver a sonreír juntas.</p><div class="album" id="fotos"></div><div class="album" id="videos"></div></main><script>document.querySelector('#fotos').innerHTML=CLIENT_MEDIA.fotos.map((f,i)=>'<a href="'+f.ruta+'" target="_blank" rel="noopener"><img loading="lazy" src="'+f.ruta+'" alt="'+(f.nota||'Recuerdo personal '+(i+1))+'"></a>').join('');document.querySelector('#videos').innerHTML=CLIENT_MEDIA.videos.map((v,i)=>'<video controls playsinline preload="none" src="'+v.ruta+'" aria-label="Recuerdo en video '+(i+1)+'"></video>').join('');document.querySelectorAll('video').forEach(v=>v.addEventListener('play',()=>document.querySelectorAll('video').forEach(w=>{if(w!==v)w.pause()})));</script></body></html>
