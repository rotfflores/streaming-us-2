<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#141414">
  <meta property="og:title" content="Temporadas de Nosotros">
  <meta property="og:description" content="El contenido se desbloqueará cuando se confirme el pago.">
  <title>Pago pendiente · Temporadas de Nosotros</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { box-sizing: border-box; min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #141414; color: #faf6f2; }
    main { box-sizing: border-box; width: min(100%, 480px); padding: clamp(24px, 6vw, 46px); border: 1px solid #3b3334; border-radius: 16px; background: #211c1e; text-align: center; box-shadow: 0 20px 80px #0006; }
    .brand { margin: 0 0 1.4rem; color: #ff777e; font-size: .85rem; font-weight: 750; letter-spacing: .11em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.85rem, 6vw, 2.6rem); line-height: 1.1; }
    .message { margin: 1rem 0 0; color: #e0d3d4; font-size: 1.05rem; line-height: 1.55; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Temporadas de Nosotros</p>
    <h1>Pago pendiente</h1>
    <p class="message">El contenido se desbloqueará cuando se confirme el pago.</p>
  </main>
</body>
</html>
